<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita - Dinas Pendidikan dan Kebudayaan Provinsi Papua Pegunungan</title>
  <meta name="description" content="Berita dan publikasi kegiatan Dinas Pendidikan dan Kebudayaan Provinsi Papua Pegunungan.">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tw-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="berita" class="min-h-screen bg-white text-hutan-800">
<div id="site-header"></div>

<main>
  <section class="relative isolate overflow-hidden bg-gradient-to-br from-brand-800 via-brand-700 to-edu-800 text-white">
    <div class="bg-grid absolute inset-0 -z-10"></div>
    <div class="mx-auto max-w-6xl px-4 pb-6 pt-16 sm:px-6">
      <p class="eyebrow text-white">Publikasi Kegiatan</p>
      <h1 class="mt-4 text-4xl font-extrabold tracking-tight sm:text-5xl">Berita</h1>
      <p class="mt-4 max-w-xl text-hutan-200">Kabar terbaru kegiatan pendidikan dan kebudayaan di Papua Pegunungan.</p>
    </div>
    <svg class="block h-16 w-full sm:h-24" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#0b513b" d="M0 80 L160 30 L320 70 L480 15 L640 75 L800 35 L960 80 L1120 25 L1280 70 L1440 40 V120 H0Z"/>
      <path fill="#ffffff" d="M0 110 L240 85 L480 105 L720 80 L960 105 L1200 85 L1440 100 V120 H0Z"/>
    </svg>
  </section>

  <section class="mx-auto max-w-6xl px-4 py-16 sm:px-6">
    <div id="filter" class="flex flex-wrap gap-2" role="group" aria-label="Saring kategori"></div>
    <div id="berita-list" class="mt-10 grid gap-x-8 gap-y-12 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  (function () {
    const kategori = ['Semua', ...new Set(BERITA.map((b) => b.kategori))];
    const filter = document.getElementById('filter');
    const list = document.getElementById('berita-list');
    const render = (k) => {
      filter.innerHTML = kategori.map((x) => `<button type="button" data-k="${x}" aria-pressed="${x === k}" class="rounded-full border px-4 py-1.5 text-sm font-semibold transition ${x === k ? 'border-hutan-950 bg-hutan-950 text-white' : 'border-hutan-200 text-hutan-600 hover:border-brand-400'}">${x}</button>`).join('');
      list.innerHTML = BERITA.filter((b) => k === 'Semua' || b.kategori === k).map(beritaCard).join('');
      observeReveal();
    };
    filter.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) render(b.dataset.k); });
    render('Semua');
  })();
</script>
</body>
</html>
