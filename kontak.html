<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak Kami - Dinas Pendidikan dan Kebudayaan Provinsi Papua Pegunungan</title>
  <meta name="description" content="Alamat, telepon, email, dan jam layanan Dinas Pendidikan dan Kebudayaan Provinsi Papua Pegunungan.">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tw-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="kontak" class="min-h-screen bg-white text-hutan-800">
<div id="site-header"></div>

<main>
  <section class="relative isolate overflow-hidden bg-gradient-to-br from-brand-800 via-brand-700 to-edu-800 text-white">
    <div class="bg-grid absolute inset-0 -z-10"></div>
    <div class="mx-auto max-w-6xl px-4 pb-6 pt-16 sm:px-6">
      <p class="eyebrow text-white">Kontak</p>
      <h1 class="mt-4 text-4xl font-extrabold tracking-tight sm:text-5xl">Hubungi Kami</h1>
      <p class="mt-4 max-w-xl text-hutan-200">Kami siap membantu pertanyaan seputar pendidikan dan kebudayaan di Papua Pegunungan.</p>
    </div>
    <svg class="block h-16 w-full sm:h-24" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#0b513b" d="M0 80 L160 30 L320 70 L480 15 L640 75 L800 35 L960 80 L1120 25 L1280 70 L1440 40 V120 H0Z"/>
      <path fill="#ffffff" d="M0 110 L240 85 L480 105 L720 80 L960 105 L1200 85 L1440 100 V120 H0Z"/>
    </svg>
  </section>

  <section class="mx-auto grid max-w-6xl gap-10 px-4 py-16 sm:px-6 lg:grid-cols-[1fr_1.3fr]">
    <div class="reveal">
      <ul id="kontak-list" class="divide-y divide-hutan-100 border-y border-hutan-100"></ul>
      <a id="wa-btn" target="_blank" rel="noopener" class="btn btn-primary mt-8"><i class="fa-brands fa-whatsapp text-base"></i>Chat WhatsApp</a>
    </div>
    <div class="reveal overflow-hidden rounded-lg border border-hutan-100">
      <iframe title="Peta lokasi kantor Dinas Pendidikan dan Kebudayaan Provinsi Papua Pegunungan di Wamena" src="https://maps.google.com/maps?q=Wamena%2C%20Jayawijaya%2C%20Papua%20Pegunungan&z=14&output=embed" class="h-80 w-full border-0 lg:h-full lg:min-h-[420px]" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  const rows = [
    ['fa-solid fa-location-dot', 'Alamat', SITE.alamat],
    ['fa-solid fa-phone', 'Telepon', `<a href="tel:${SITE.telepon}" class="hover:text-brand-700">${SITE.telepon}</a>`],
    ['fa-regular fa-envelope', 'Email', `<a href="mailto:${SITE.email}" class="break-all hover:text-brand-700">${SITE.email}</a>`],
    ['fa-regular fa-clock', 'Jam Layanan', 'Senin–Kamis 08.00–16.00 WIT<br>Jumat 08.00–16.30 WIT'],
  ];
  document.getElementById('kontak-list').innerHTML = rows.map(([i, l, v]) => `
    <li class="flex gap-4 py-5"><i class="${i} mt-1 w-5 text-lg text-brand-600"></i>
      <div><p class="text-xs font-bold uppercase tracking-wider text-hutan-400">${l}</p><p class="mt-1 font-semibold text-hutan-950">${v}</p></div></li>`).join('');
  document.getElementById('wa-btn').href = 'https://wa.me/' + SITE.wa.replace(/\D/g, '');
</script>
</body>
</html>
